# Blueprint da Render para o backend de avatar (Analytics de Taverna).
# Sobe 3 recursos num projeto só: API (web) + worker (arq) + Redis (Key Value).
#
# O frontend Next.js continua na Vercel; aponte-o pra API via a env var
# NEXT_PUBLIC_AVATAR_API_URL (veja backend/README.md → Produção).
#
# Este arquivo fica na RAIZ do repositório git (site_ic/), que é onde a Render
# procura o render.yaml. Cada serviço usa rootDir: rpg-site/backend.

# Segredos/config compartilhados entre a API e o worker.
envVarGroups:
  - name: avatar-config
    envVars:
      # Definido no dashboard da Render (sync:false = não versionado).
      - key: GEMINI_API_KEY
        sync: false
      # Modelo de imagem. Troque aqui se sua key usar outro (ex.: gemini-2.5-flash-image).
      - key: GEMINI_IMAGE_MODEL
        value: gemini-3.1-flash-image

services:
  # ── API FastAPI ────────────────────────────────────────────────────
  - name: avatar-api
    type: web
    runtime: python
    rootDir: rpg-site/backend
    plan: starter # free também funciona, mas hiberna após inatividade (cold start)
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - fromGroup: avatar-config
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: avatar-redis
          property: connectionString

  # ── Worker arq (chama o Gemini) ────────────────────────────────────
  # PRECISA de plano pago: background workers não existem no tier free.
  - name: avatar-worker
    type: worker
    runtime: python
    rootDir: rpg-site/backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: arq app.workers.avatar_worker.WorkerSettings
    envVars:
      - fromGroup: avatar-config
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: avatar-redis
          property: connectionString

  # ── Redis gerenciado (fila + resultado com TTL de 24h) ─────────────
  - name: avatar-redis
    type: keyvalue
    plan: free # 25MB — ok pra começar; a limpeza antecipada (DELETE) evita acúmulo
    # Lista vazia = sem acesso pela internet pública; só a API e o worker
    # (mesma rede privada da Render) conseguem conectar.
    ipAllowList: []
    # noeviction: nunca descarta jobs/resultados silenciosamente. Se encher, o
    # SET falha (job vira erro → fallback no front) em vez de perder dados.
    maxmemoryPolicy: noeviction
